name: Release packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/*/CHANGELOG.md"
      - ".changeset/*"

concurrency: ${{ github.workflow }}-${{ github.ref }}
env:
    NPM_CONFIG_PROVENANCE: true

jobs:
  # @padosoft/ecr17's Node-API addon, built and tested on each shipped platform.
  node-prebuilds:
    uses: ./.github/workflows/node.yml
    secrets: inherit

  release:
    if: github.repository == 'padosoft/react-native-ecr17-protocol'
    name: Release
    needs: node-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ci-setup
        env:
          GESCAT_NPM_TOKEN: ${{ secrets.GESCAT_NPM_TOKEN }}
          
      # packages/ecr17/prebuilds/<platform>-<arch>/ecr17.node, shipped in the npm package
      # (src/native.ts loads it; Node-API is ABI-stable across Node versions).
      - name: Collect the Node addon prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: packages/ecr17/prebuilds

      - name: Name the prebuild folders by platform
        working-directory: packages/ecr17/prebuilds
        run: |
          for dir in prebuild-*; do mv "$dir" "${dir#prebuild-}"; done
          find . -name ecr17.node

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun version-packages
          publish: bun publish-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changeset publish (above) targets npmjs.org via publishConfig.registry.
      # Mirror the same version to GitHub Packages so the app can install from there too.
      # Runs with always() and decides from the registries directly, because the
      # changesets step often succeeds the npm publish but then fails creating the
      # GitHub Release (transient HttpError) — we must not let that skip the mirror.
      # Auth via GESCAT_NPM_TOKEN (a PAT authorized for the @padosoft org) — the same
      # token gescat-openapi-spec uses. The default GITHUB_TOKEN is not allowed to
      # create packages in this org, so it fails with ENEEDAUTH / create_package 403.
      - name: Publish to GitHub Packages
        if: always()
        run: |
          # IMPORTANT: this is a workspace; npm ignores .npmrc inside workspace members
          # (packages/*). The auth/registry config must live at the repo root, and it is
          # written only after the npmjs lookups so the scope->GitHub mapping can't
          # redirect them.
          NPMRC="$GITHUB_WORKSPACE/.npmrc"
          trap 'rm -f "$NPMRC"' EXIT
          for dir in packages/*/; do
            NAME=$(node -p "require('./${dir}package.json').name")
            VERSION=$(node -p "require('./${dir}package.json').version")
            # Only mirror a version that actually made it to npmjs (i.e. a real publish run).
            rm -f "$NPMRC"
            if ! npm view "$NAME@$VERSION" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is not on npmjs yet — nothing to mirror."
              continue
            fi
            {
              echo "@padosoft:registry=https://npm.pkg.github.com/"
              echo "//npm.pkg.github.com/:_authToken=${GESCAT_NPM_TOKEN}"
            } > "$NPMRC"
            if npm view "$NAME@$VERSION" --registry=https://npm.pkg.github.com version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on GitHub Packages — nothing to do."
              continue
            fi
            # The RN package's build output comes from the publish path (codegen); rebuild if absent.
            if [ "$NAME" = "@padosoft/react-native-ecr17" ] && [ ! -d "${dir}lib" ]; then
              (cd "$dir" && bun run codegen)
            fi
            # @padosoft/ecr17's Node.js entry (dist/) also comes from the publish path.
            if [ "$NAME" = "@padosoft/ecr17" ] && [ ! -d "${dir}dist" ]; then
              (cd "$dir" && bun run build)
            fi
            (cd "$dir" && npm publish --registry=https://npm.pkg.github.com)
          done
        env:
          GESCAT_NPM_TOKEN: ${{ secrets.GESCAT_NPM_TOKEN }}
          # Provenance/sigstore is npmjs-only; it breaks publishing to GitHub Packages.
          NPM_CONFIG_PROVENANCE: false

      # SwiftPM resolves the root Package.swift (the Ecr17 product, i.e. @padosoft/ecr17) by a
      # plain semver tag, while changesets tags `@padosoft/ecr17@X.Y.Z`. Add `X.Y.Z` on the
      # same commit for every published core version. The old 1.x tags belong to the
      # pre-monorepo package; the core starts at 2.0.0, so they never collide.
      - name: Tag the Swift package version
        if: always()
        run: |
          VERSION=$(node -p "require('./packages/ecr17/package.json').version")
          if ! git rev-parse -q --verify "refs/tags/@padosoft/ecr17@$VERSION" >/dev/null; then
            echo "@padosoft/ecr17@$VERSION is not tagged yet — no Swift package tag."
          elif git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists."
          else
            git tag "$VERSION" "@padosoft/ecr17@$VERSION^{commit}"
            # Lightweight tag: --follow-tags (below) would skip it, so push it explicitly.
            git push origin "refs/tags/$VERSION"
          fi

      - name: Publish release tags
        run: git push --follow-tags --set-upstream origin HEAD