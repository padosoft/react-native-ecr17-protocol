name: TS & codegen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ts-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    if: github.repository == 'padosoft/react-native-ecr17-protocol'
    name: Typecheck + Nitrogen codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: README in sync (root mirrors packages/react-native-ecr17/README.md)
        run: bun scripts/sync-readme.ts --check

      - name: Install dependencies
        # The @padosoft tooling packages (@padosoft/config, the base of tsconfig.json /
        # biome.json; @padosoft/native-modules and @padosoft/expo, the native build
        # helpers) live on a private GitHub Packages registry and are not on npm yet.
        # Typecheck and nitrogen need none of them (tsconfig.ci.json is
        # self-contained), so drop them before install to avoid registry auth.
        run: |
          bun scripts/strip-private-deps.ts
          rm -f bun.lock
          bun install

      - name: Nitrogen codegen
        working-directory: packages/react-native-ecr17
        run: bunx nitrogen

      - name: Typecheck (self-contained config)
        working-directory: packages/react-native-ecr17
        run: bunx tsc --noEmit -p tsconfig.ci.json
