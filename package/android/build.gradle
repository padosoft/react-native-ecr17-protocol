// The whole Android build of this Nitro module comes from @padosoft/native-modules'
// nitro-module.gradle: plugins, SDK versions (rootProject ext, else Ecr17_* in
// gradle.properties), CMake, nitrogen autolinking, prefab and the New Architecture.
// The protocol core is compiled by CMakeLists.txt from @padosoft/ecr17-kit.
ext.nitroModule = [
  name:        "Ecr17",
  namespace:   "com.padosoft.ecr17",
  buildMode:   "source",  // no prebuilt .so is committed
  sharedUtils: false,     // no DDLog: :padosoft-shared-utils is not needed
]

def nativeModulesGradle = new File(["node", "--print",
    "require.resolve('@padosoft/native-modules/package.json')"]
    .execute(null, projectDir).text.trim()).parentFile.toPath().resolve("gradle").toFile()
apply from: file("${nativeModulesGradle}/nitro/nitro-module.gradle")
